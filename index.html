<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialect Science</title>
  <meta name="description" content="Research on dialects and language variation. The full site is on its way.">
  <meta property="og:title" content="Dialect Science">
  <meta property="og:description" content="Research on dialects and language variation. The full site is on its way.">
  <meta property="og:url" content="https://dialect.science/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#EEF1EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121826" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A2236'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23EEF1EE'%3Ed%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #EEF1EE;
      --ink: #1A2236;
      --muted: #4E5869;
      --accent: #2A7F7A;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #121826;
        --ink: #E7EBF2;
        --muted: #A6AFBF;
        --accent: #5EC4BB;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "Gentium Book Plus", "Charis SIL", Georgia, serif;
      font-size: 1.1875rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    main,
    footer {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding-inline: 1.5rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-block: 4rem 2rem;
    }

    h1 {
      margin: 0 0 0.25em;
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.02em;
    }

    .ipa {
      margin: 0 0 2.25rem;
      color: var(--muted);
      font-size: clamp(1.25rem, 2.5vw, 1.5rem);
    }

    p { margin: 0 0 1rem; max-width: 30rem; }

    a {
      color: var(--ink);
      text-decoration-line: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.2em;
    }

    a:hover { color: var(--accent); }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    footer {
      padding-block: 2rem 2.5rem;
      color: var(--muted);
      font-size: 0.9375rem;
    }
  </style>
</head>
<body>

  <main>
    <h1>Dialect<br>Science</h1>
    <p class="ipa">/ˈdaɪəlɛkt ˈsaɪəns/</p>
    <p>A home for research on dialects and language variation. The full site is on its way.</p>
    <p>Until then, you can find me at <a href="https://glennwilliams.me">glennwilliams.me</a>.</p>
  </main>

  <footer>© 2026 Glenn Williams</footer>

</body>
</html>
